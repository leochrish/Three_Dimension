name: Publish to Maven Central

on:
  push:
    branches:
      - main # Triggers whenever code is pushed or merged into the main branch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      - name: Build and Sign SDK
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew :ThreeD:publishReleasePublicationToLocalStagingRepository --no-configuration-cache

      - name: Zip the bundle
        run: |
          mkdir -p bundle_root
          # Copy ThreeD artifacts from the staging repo
          # Assuming the group ID is com.chris.threed, the directory structure starts with 'com'
          if [ -d "ThreeD/build/staging-repo/com" ]; then
            cp -r ThreeD/build/staging-repo/com bundle_root/
          fi
          cd bundle_root
          zip -r ../bundle.zip .

      - name: Upload to Sonatype Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          curl -u "$SONATYPE_USERNAME:$SONATYPE_PASSWORD" \
               -X POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=ThreeDimension-Release-${{ github.run_number }}" \
               -H "Accept: application/json" \
               -F "bundle=@bundle.zip"
